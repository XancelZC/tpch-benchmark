target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B", "BLE", "EXE"]

[lint.per-file-ignores]
# 连接器是系统边界：必须把不同驱动的异常统一转换为 QueryResult 或布尔失败。
"src/db_connector.py" = ["BLE001"]
# 独立脚本需要先把项目根目录加入 sys.path，之后才能导入 src。
"scripts/validate_database.py" = ["E402"]
# 图表脚本需兼容 Python 3.9+ 环境，不使用 zip(strict=) 语法。
"tools/make_charts.py" = ["B905", "EXE001"]
